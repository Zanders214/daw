<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin:0; font-family:'Space Grotesk',system-ui,sans-serif; }
  .stage { padding:24px; background:radial-gradient(120% 80% at 50% -10%, #1a2030, #0a0b12); display:flex; gap:20px; align-items:flex-start; }
  .col { display:flex; flex-direction:column; gap:12px; }
  .lbl { font-size:10px; letter-spacing:0.16em; color:#7e8794; font-weight:600; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { GlowButton, Badge, Chip } = window.NeonPluginsDesignSystem_54a692;
function Demo(){
  return (
    <div className="stage">
      <div className="col" style={{width:200}}>
        <span className="lbl">GLOW TOGGLE — IDLE / ENGAGED</span>
        <GlowButton variant="accent" engaged={false} idleLabel="SUSTAIN">SUSTAIN</GlowButton>
        <GlowButton variant="accent" engaged={true}>PEDAL DOWN</GlowButton>
        <GlowButton variant="danger" engaged={false} idleLabel="STOP">STOP</GlowButton>
        <GlowButton variant="danger" engaged={true}>STOPPING</GlowButton>
      </div>
      <div className="col" style={{flex:1}}>
        <span className="lbl">BADGES</span>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <Badge>BUILD&#8209;UP</Badge><Badge>WIND&#8209;DOWN</Badge><Badge>GRAND</Badge>
        </div>
        <span className="lbl" style={{marginTop:8}}>CHIP ROW — ACTIVE / DIMMED</span>
        <div style={{display:'flex',gap:7}}>
          <Chip label="HPF" value="240 Hz" color="#34d8ff" active={true} />
          <Chip label="REV" value="62%" color="#8b7bff" active={true} />
          <Chip label="DLY" value="40%" color="#ff5fa8" active={false} />
          <Chip label="RIS" value="0%" color="#ffc24b" active={false} />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
