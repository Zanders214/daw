sonar.projectKey=zandersdaw_daw
sonar.organization=zandersdaw
sonar.projectName=Zanders DAW

# Source roots for all three languages
sonar.sources=src,juce-host/Source,src-tauri/src
sonar.sourceEncoding=UTF-8

# Vitest tests live next to the code they cover
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage / external analyzer reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.cfamily.compile-commands=build/compile_commands.json
sonar.rust.clippy.reportPaths=clippy-report.json

# Keep build output, deps, vendored + generated/style files out of analysis
sonar.exclusions=node_modules/**,dist/**,dist-ssr/**,build/**,src-tauri/target/**,src-tauri/gen/**,juce-host/build/**,public/**,design/**,**/*.css,src/data/seed.ts

# Don't let entrypoints / generated data drag coverage numbers
sonar.coverage.exclusions=src/main.tsx,src/data/**,src/styles/**,**/*.test.*,**/*.spec.*
