name: Audio Quality Gates

# Real-time-safety + memory/UB/thread auditing of the JUCE host's audio engine.
# This repo builds a HOST app (not a plugin), so there is no VST3 to run through
# pluginval; instead we drive the real AudioEngine render path headless under
# clang's sanitizers (see juce-host/tests/rt_check.cpp + EngineHarness.h).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # RealtimeSanitizer: fail if any [[clang::nonblocking]] leaf DSP allocates,
  # locks or syscalls on the audio thread. Needs clang >= 20 (Linux only).
  rtsan:
    name: RealtimeSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Install clang 20 (RealtimeSanitizer)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20

      - uses: lukka/get-cmake@latest

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-Linux-8.0.4-${{ hashFiles('juce-host/CMakeLists.txt') }}
          restore-keys: juce-Linux-8.0.4

      - name: Configure & build rt_check
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DZD_RT_SANITIZE=ON juce-host
          cmake --build build --target rt_check --parallel

      - name: Run under RealtimeSanitizer
        env:
          RTSAN_OPTIONS: "halt_on_error=1:suppressions=${{ github.workspace }}/juce-host/tests/rtsan_suppressions.txt"
        run: |
          # ScopedJuceInitialiser_GUI needs a display even headless; JUCE nests the
          # binary under <target>_artefacts/<config>/ — discover it, don't hardcode.
          BIN=$(find build -type f -name rt_check -path '*_artefacts*' | head -1)
          test -n "$BIN" || { echo "rt_check binary not found"; exit 1; }
          xvfb-run -a "$BIN"

  # AddressSanitizer / UBSan / ThreadSanitizer over the same engine driver.
  # TSan spins a control thread (ZD_CONCURRENT_CONTROL) so it can see message-vs-
  # audio-thread races; it is informational for now (continue-on-error) because it
  # surfaces a known, separately-tracked data race (AudioEngine::source.inputMode).
  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.sanitizer == 'thread' }}
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Install clang 20
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20

      - uses: lukka/get-cmake@latest

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-Linux-8.0.4-${{ hashFiles('juce-host/CMakeLists.txt') }}
          restore-keys: juce-Linux-8.0.4

      - name: Configure & build engine_check
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DZD_BUILD_SANITIZE=ON -DZD_SANITIZER=${{ matrix.sanitizer }} juce-host
          cmake --build build --target engine_check --parallel

      - name: Run under ${{ matrix.sanitizer }} sanitizer
        env:
          # JUCE singletons trip LeakSanitizer at exit; keep ASan on memory-safety.
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=0"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: |
          BIN=$(find build -type f -name engine_check -path '*_artefacts*' | head -1)
          test -n "$BIN" || { echo "engine_check binary not found"; exit 1; }
          xvfb-run -a "$BIN"
