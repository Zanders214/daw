name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the React/Vite UI once; the JUCE host bundles dist/ as BinaryData.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 3
          if-no-files-found: error

  # Consolidated SonarQube Cloud analysis: TypeScript (+ Vitest coverage),
  # C++ (via CMake compilation database) and Rust (via Clippy report). A single
  # scan must cover all languages, so this job produces each toolchain's inputs
  # before invoking the scanner. It builds its own dist/, so it runs in parallel
  # with web/host and never blocks the release path. Skipped on fork PRs, which
  # can't read SONAR_TOKEN.
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history -> accurate SCM blame / new-code detection

      # --- TypeScript: install, test with coverage, build dist/ ---
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run test:coverage # -> coverage/lcov.info
      - run: npm run build # -> dist/ (bundled by the JUCE host as BinaryData)

      # --- C++: system deps, JUCE cache, configure+build exporting a compile DB ---
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-Linux-8.0.4-${{ hashFiles('juce-host/CMakeLists.txt') }}
          restore-keys: juce-Linux-8.0.4

      - name: Configure & build JUCE host (export compile DB)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON juce-host
          cmake --build build --parallel

      # --- Rust: Clippy JSON report for the Tauri crate ---
      - name: Rust Clippy report
        working-directory: src-tauri
        run: |
          rustup component add clippy
          cargo clippy --all-targets --message-format=json > ../clippy-report.json || true

      # --- Single scan covering TS + C++ + Rust (reads sonar-project.properties) ---
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Compile the JUCE host against real toolchains on each OS.
  host:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macOS }
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-latest, name: Linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      # Cache the JUCE source pulled by CMake FetchContent.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-8.0.4-${{ hashFiles('juce-host/CMakeLists.txt') }}
          restore-keys: juce-${{ runner.os }}-8.0.4

      - name: Configure & build (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release juce-host
          cmake --build build --parallel

      - name: Configure & build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # JUCE's NEEDS_WEBVIEW2 needs the WebView2 SDK present; restore it via NuGet
          # and point JUCE at the package (the VS generator does not auto-restore it).
          nuget install Microsoft.Web.WebView2 -ExcludeVersion -OutputDirectory "${{ github.workspace }}\nuget"
          # JUCE_WEBVIEW2_PACKAGE_LOCATION is the parent dir that CONTAINS the
          # Microsoft.Web.WebView2 package folder (not the package folder itself).
          cmake -B build "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=${{ github.workspace }}\nuget" juce-host
          cmake --build build --config Release --parallel

      - name: List build artefacts
        shell: bash
        run: |
          echo "--- build/ZandersDAW_artefacts ---"
          find build -path '*ZandersDAW_artefacts*' -maxdepth 6 -print 2>/dev/null | head -50 || true

      # Ad-hoc code-sign the macOS bundle so Gatekeeper stops reporting it as
      # "damaged" on download, then zip it with ditto (which preserves the .app
      # bundle structure + the signature). Not notarised: the first launch still
      # needs a right-click -> Open, or `xattr -cr`.
      - name: Sign & package app (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="build/ZandersDAW_artefacts/Release/Zanders DAW.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "Zanders-DAW-macOS.zip"

      - name: Package app (Linux)
        if: runner.os == 'Linux'
        run: |
          cd "build/ZandersDAW_artefacts/Release"
          zip -j "$GITHUB_WORKSPACE/Zanders-DAW-Linux.zip" "Zanders DAW"

      - name: Package app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "build/ZandersDAW_artefacts/Release/*" -DestinationPath "Zanders-DAW-Windows.zip" -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: Zanders-DAW-*.zip
          if-no-files-found: error
          retention-days: 7

  # Publish every dev / claude-* build as a single rolling "latest" GitHub
  # Release, so the apps download in one click -- no GitHub login, no digging
  # through CI artifacts. (Versioned releases can be added later via git tags.)
  release:
    needs: host
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/claude/')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: pkgs
          pattern: pkg-*
          merge-multiple: true

      - name: List packages
        run: ls -lR pkgs

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          short="$(echo "$GITHUB_SHA" | cut -c1-7)"
          {
            echo "Automated build of ${GITHUB_REF_NAME} (${short}) -- $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo 'macOS: ad-hoc signed but not notarised by Apple. On first launch, right-click the app and choose "Open" (or run: xattr -cr "Zanders DAW.app").'
          } > notes.md
          # Roll the tag + release onto this commit with fresh assets.
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Latest build" --notes-file notes.md pkgs/*.zip
