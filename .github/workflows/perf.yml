name: Performance Benchmark

# Track the JUCE host engine's per-block DSP cost over time and flag regressions.
# Single runner only — cross-OS numbers aren't comparable. Publishes a trend
# dashboard to gh-pages (dev/bench/) from the dev integration branch; PR runs just
# measure + compare + comment.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev xvfb

      - uses: lukka/get-cmake@latest

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-Linux-8.0.4-${{ hashFiles('juce-host/CMakeLists.txt') }}
          restore-keys: juce-Linux-8.0.4

      - name: Configure & build perf_bench
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZD_BUILD_BENCH=ON juce-host
          cmake --build build --target perf_bench --parallel

      - name: Run benchmark
        run: |
          BIN=$(find build -type f -name perf_bench -path '*_artefacts*' | head -1)
          test -n "$BIN" || { echo "perf_bench binary not found"; exit 1; }
          xvfb-run -a "$BIN" "$GITHUB_WORKSPACE/bench_result.json"
          cat "$GITHUB_WORKSPACE/bench_result.json"

      - name: Store / compare benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: ZandersDAW engine
          tool: customSmallerIsBetter
          output-file-path: bench_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          # Publish history only from dev; PRs just compare + comment.
          auto-push: ${{ github.ref == 'refs/heads/dev' }}
          comment-on-alert: true
          fail-on-alert: true
          alert-threshold: "150%" # generous, to absorb shared-runner noise
          summary-always: true
